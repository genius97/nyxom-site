# Nyxom static site — Nginx server config
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # Security headers (applied to document responses)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml font/woff2;

    # Long-lived cache for self-hosted fonts
    location ~* \.(?:woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache other static assets
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Serve pages; fall back to the branded 404
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
