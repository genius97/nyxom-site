<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lgN" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#5BD9FF"/>
    </linearGradient>
  </defs>
  <!-- constellation N: three strokes of the letter drawn as star-lines -->
  <path d="M14 50V16l36 34V21" fill="none" stroke="url(#lgN)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- nodes -->
  <circle cx="14" cy="50" r="3.4" fill="#3D7BFF"/>
  <circle cx="14" cy="16" r="3.4" fill="#4FA6FF"/>
  <circle cx="50" cy="50" r="3.4" fill="#5BD9FF"/>
  <!-- the Nyx star: gold sparkle crowning the letter -->
  <path d="M50 6c.8 4.4 2.6 6.2 7 7-4.4.8-6.2 2.6-7 7-.8-4.4-2.6-6.2-7-7 4.4-.8 6.2-2.6 7-7Z" fill="#EFC377"/>
  <!-- faint companion stars -->
  <circle cx="30" cy="9" r="1.1" fill="#9DB9FF" opacity=".7"/>
  <circle cx="59" cy="33" r="1" fill="#9DB9FF" opacity=".55"/>
  <circle cx="6" cy="31" r="1" fill="#EFC377" opacity=".6"/>
</svg>
